@if (showSidebar) {
  <aside [class.sidebar-open]="sidebarOpen" class="sidebar">
    <!-- Header -->
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">📱</span>
        <span class="logo-text" [class.hidden]="!sidebarOpen">SI-Relevé</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()" [class.rotated]="!sidebarOpen">
        ◀
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <ul class="nav-list">
        @for (item of filteredMenuItems; track item.route) {
          <li class="nav-item">
            <a 
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="nav-link">
              <span class="nav-icon">{{ getIcon(item.icon) }}</span>
              <span class="nav-label" [class.hidden]="!sidebarOpen">{{ item.label }}</span>
            </a>
          </li>
        } @empty {
          <li class="nav-item">
            <span class="nav-label">Aucun menu</span>
          </li>
        }
      </ul>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="user-info" [class.hidden]="!sidebarOpen">
        <div class="user-avatar">👤</div>
        <div class="user-details">
          <p class="user-role">{{ getRoleDisplay() }}</p>
          <p class="user-status">Connecté</p>
        </div>
      </div>
      
      <button class="logout-btn" (click)="logout()" [title]="sidebarOpen ? '' : 'Déconnexion'">
        <span class="logout-icon">🚪</span>
        <span class="logout-text" [class.hidden]="!sidebarOpen">Déconnexion</span>
      </button>
    </div>
  </aside>
}
