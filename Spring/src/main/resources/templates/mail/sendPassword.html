<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Account Details</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding:40px 0;">
    <tr>
        <td align="center">

            <!-- Card -->
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.08); overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="background-color:#4f46e5; padding:24px; text-align:center; color:#ffffff;">
                        <h1 style="margin:0; font-size:24px;">Welcome!</h1>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:32px; color:#333333;">
                        <p style="font-size:16px; margin:0 0 16px;">
                            Hello <strong><span th:text="${name}">User</span></strong>,
                        </p>

                        <p style="font-size:15px; margin:0 0 24px; line-height:1.5;">
                            Your account has been created successfully. Below are your login credentials:
                        </p>

                        <!-- Password Box -->
                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background-color:#f1f5f9; border:1px dashed #cbd5e1; border-radius:6px; margin-bottom:24px;">
                            <tr>
                                <td style="padding:16px; text-align:center;">
                                    <span style="font-size:14px; color:#64748b;">Your temporary password</span><br>
                                    <span th:text="${password}"
                                          style="font-size:20px; font-weight:bold; letter-spacing:2px; color:#111827;">
                                        password
                                    </span>
                                </td>
                            </tr>
                        </table>

                        <p style="font-size:14px; color:#555; line-height:1.5;">
                            For security reasons, please change your password after your first login.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f8fafc; padding:16px; text-align:center; font-size:12px; color:#94a3b8;">
                        © 2025 Your Company • This is an automated message
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
